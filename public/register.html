<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hunter's Atlas</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/scripts/loader.js" defer></script>
    <script type="module" src="/scripts/register.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <header id="header"></header>

    <main class="register-main">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="register-card">
                        <div class="register-header">
                            <div class="d-flex align-items-center justify-content-center mb-4">
                                <img src="./images/logo-hunter-v2.png" alt="hunter logo" class="custom-logo">
                                <h2 class="ms-3">Hunter's Atlas</h2>
                            </div>
                            <h3 class="text-center mb-4">Create Your Account</h3>
                        </div>
                        
                        <form id="registerForm">
                            <div class="form-group mb-3">
                                <label for="registerEmail" class="form-label">Email Address</label>
                                <input type="email" id="registerEmail" class="form-control" placeholder="Enter your email" required>
                            </div>
                            
                            <div class="form-group mb-3">
                                <label for="registerUsername" class="form-label">Username</label>
                                <input type="text" id="registerUsername" class="form-control" placeholder="Choose a username" required minlength="3">
                            </div>
                            
                            <div class="form-group mb-3">
                                <label for="registerPassword" class="form-label">Password</label>
                                <div class="password-field">
                                    <input type="password" id="registerPassword" class="form-control" placeholder="Create a password" required minlength="6">
                                    <span class="password-toggle" id="toggleRegisterPassword">
                                        <i class="fas fa-eye"></i>
                                    </span>
                                </div>
                            </div>
                            
                            <div class="form-group mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <div class="password-field">
                                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required minlength="6">
                                    <span class="password-toggle" id="toggleConfirmPassword">
                                        <i class="fas fa-eye"></i>
                                    </span>
                                </div>
                            </div>
                            
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                                <label class="form-check-label" for="agreeTerms">
                                    I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a>
                                </label>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 mb-3" id="registerBtn">
                                <span class="btn-text">Create Account</span>
                                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            </button>
                            
                            <div id="registerError" class="alert alert-danger d-none" role="alert"></div>
                            <div id="registerSuccess" class="alert alert-success d-none" role="alert"></div>
                        </form>
                        
                        <div class="login-link text-center">
                            Already have an account? <a href="index.html" class="text-primary">Sign in here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>
</body>

</html>
